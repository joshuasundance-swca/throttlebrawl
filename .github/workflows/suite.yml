# The test suite (docs/engineering.md, "CI on GitHub Actions"), one copy shared by every caller so
# they can never drift: ci.yml runs it on a pull request and on a push to main, and train.yml runs
# it on a train's bundle (docs/engineering.md, "The bundle train"). static, unit (two slices), sim
# (seven slices) and browser (eight slices, the last also running perf) run in parallel, each
# running its tiers of `npm run check`. Every slice is planned as its whole job (setup, build and
# tests; scripts/shard-plan.mjs) at no more than 70% of its timeout-minutes, which
# scripts/shard-plan.test.ts checks against tests/timings.json and these matrices; the rest is room
# for a slow runner. The timeout is a guard against a hang rather than a budget.
#
# - full: true runs every tier: the full gate, 18 jobs. full: false is the quick check, 3 jobs:
#   static (plus the build and its size budget, `--tier static,budget`) and the two unit slices.
# - A train passes `base` (main when it departed) and `heads` (the PR head commits, in order):
#   every job checks out base and runs scripts/train.mjs assemble, which rebuilds exactly the tree
#   the train planned (merged with a fixed identity and date, so every job gets the same commit)
#   and checks it is the planned `tree`. The assembly script runs from base, which is main.
# - Caches: pull request and main runs save them, as before. A train runs PR code in main's cache
#   scope, so it only restores (save-caches: false), and nothing a bundle does can reach main's
#   caches.
# - Fail fast (docs/engineering.md, "Fail fast on a PR"): when the caller turns the fail-fast
#   input on (only ci.yml does, and only on a pull request), the first red job cancels the rest of
#   the caller's run. A train never does: its control and report jobs come after the suite.
# - Permissions: none of its own. Every job gets its caller's token (a called workflow can only
#   lower it): ci.yml's suite call grants actions: write for the cancel, and the train's calls
#   grant contents: read only, since a bundle is PR code.
name: suite

on:
  workflow_call:
    inputs:
      full:
        description: every tier (true), or the quick check (static, the build and its size budget, unit)
        type: boolean
        required: true
      base:
        description: the commit to check out ('' is the calling event's own)
        type: string
        default: ''
      heads:
        description: a train's PR head commits, merged onto base in this order
        type: string
        default: ''
      tree:
        description: the tree the train planned; the assembly must match it
        type: string
        default: ''
      save-caches:
        type: boolean
        default: false
      upload-dist:
        description: keep the last browser slice's build for the deploy (main pushes)
        type: boolean
        default: false
      build-id:
        type: string
        required: true
      build-branch:
        type: string
        required: true
      build-channel:
        type: string
        default: dev
      identity-range:
        description: the commits whose author and committer the leak scan checks
        type: string
        required: true
      notes-base:
        type: string
        default: origin/main
      notes-pr-author:
        type: string
        default: ''
      artifact-prefix:
        description: before each artifact name, so two suites in one run never share one
        type: string
        default: ''
      fail-fast:
        description: a red job cancels the rest of the caller's run (a pull request run only)
        type: boolean
        default: false

env:
  BUILD_ID: ${{ inputs.build-id }}
  BUILD_BRANCH: ${{ inputs.build-branch }}
  BUILD_CHANNEL: ${{ inputs.build-channel }}
  # Author and committer of the PR's own commits (never HEAD, the synthetic merge commit), on a
  # push to main the squash commit GitHub just made, or a train's PR commits and merges.
  LEAKSCAN_IDENTITY_RANGE: ${{ inputs.identity-range }}
  NOTES_BASE: ${{ inputs.notes-base }}
  # Who opened the PR, from the event (a branch cannot set it). notes:check exempts a PR only
  # when this is dependabot[bot] and every commit on it is Dependabot's (scripts/notes.mjs).
  NOTES_PR_AUTHOR: ${{ inputs.notes-pr-author }}

jobs:
  # The static checks: types, lint, format, packs, leak scan, size and notes. About 2 minutes, so
  # its own job; with the unit tests after them in one job (until 2026-10-05) it took up to 564 s.
  # The timeout is 1.5x its 122 s mean, rounded up. In the quick check the same job then builds and
  # checks the size budget (`--tier static,budget`, about 30 s more), so it gets a minute more.
  # [default]
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full && 4 || 5 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base }}
          fetch-depth: 0
      - name: Assemble the train's tree
        if: inputs.heads != ''
        env:
          BASE: ${{ inputs.base }}
          HEADS: ${{ inputs.heads }}
          TREE: ${{ inputs.tree }}
        run: node scripts/train.mjs assemble --base "$BASE" --heads "$HEADS" --tree "$TREE"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: npm cache
        if: inputs.save-caches
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: npm cache, restore only
        if: ${{ !inputs.save-caches }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - run: npm audit signatures
      - name: Types, lint, format, packs, leak scan, size, notes
        if: inputs.full
        run: npm run check -- --tier static
      - name: The quick check's static part (types, lint, format, packs, leak scan, size, notes, then the build and its size budget)
        if: ${{ !inputs.full }}
        run: npm run check -- --tier static,budget
      # Fail fast on a PR (docs/engineering.md, "Fail fast on a PR"): a red job cancels the rest of
      # the caller's run, so it stops holding runner slots; the gate reads the cancelled jobs as red.
      # A fork's token is read-only, so there the cancel is refused and the other jobs run on.
      - name: Fail fast, cancel the rest of this PR run
        if: failure() && inputs.fail-fast && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RED_JOB: static
        run: |
          echo "::error title=fail-fast::$RED_JOB failed, so it cancels the rest of this PR run; it shows as cancelled too. The gate's log names its failing tests."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || echo "::notice title=fail-fast::could not cancel run $GITHUB_RUN_ID (a fork's read-only token?); the other jobs run on"

  # The unit tests in parallel slices, split by measured CI seconds like the sim batch below. On one
  # runner they took 435 s (run 37261695645): about 980 s of tests plus each file's setup and
  # import on three workers. Their slowest file (tools/gis/region-routes.test.ts) is the floor. The
  # plan adds about 0.8 s per file for that setup and import, which Vitest's per-file times leave
  # out. They run in the quick check too. [default]
  unit:
    name: unit (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # The plan puts each slice at about 236 s of job (2026-10-06 table: tests, 0.8 s of setup per
    # file and 17 s of job setup), 49% of this timeout; slices took 145 to 351 s on 2026-10-06.
    timeout-minutes: 8
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base }}
          fetch-depth: 0
      - name: Assemble the train's tree
        if: inputs.heads != ''
        env:
          BASE: ${{ inputs.base }}
          HEADS: ${{ inputs.heads }}
          TREE: ${{ inputs.tree }}
        run: node scripts/train.mjs assemble --base "$BASE" --heads "$HEADS" --tree "$TREE"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: npm cache
        if: inputs.save-caches
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: npm cache, restore only
        if: ${{ !inputs.save-caches }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - name: Unit tests, one slice
        run: npm run check -- --tier unit --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      # Fail fast on a PR, as in static above.
      - name: Fail fast, cancel the rest of this PR run
        if: failure() && inputs.fail-fast && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RED_JOB: unit (${{ matrix.shard }}/${{ strategy.job-total }})
        run: |
          echo "::error title=fail-fast::$RED_JOB failed, so it cancels the rest of this PR run; it shows as cancelled too. The gate's log names its failing tests."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || echo "::notice title=fail-fast::could not cancel run $GITHUB_RUN_ID (a fork's read-only token?); the other jobs run on"

  # The seeded sim batch in parallel slices. The test runner lists the files and
  # scripts/shard-plan.mjs splits them by their measured CI seconds (tests/timings.json): every file
  # lands in exactly one slice, so the slices' test counts add up to the unsharded run's, and the
  # files that read the shared seeded batch share one slice, so it is computed once; the readers of
  # the Easy and Hard batches start first there. With fail-fast off (a push to main, a train) a red
  # slice never hides another's result; on a PR the first red job cancels the run (see static).
  # Full suite only. [default]
  # Seven slices since 2026-10-06: with six, slice 3/6 took 590 to 597 s of its 600 on three runs
  # (37435436811, 37437164463, 37439710625), its table stale after the test diet, and two files whose
  # work Vitest's per-file time leaves out (app-cast-and-law, riders-race, priced at 0 s) put about
  # 80 s more on whichever slice holds them. The slowest files are the floor (docs/engineering.md,
  # "The floors").
  sim:
    name: sim (${{ matrix.shard }}/${{ strategy.job-total }})
    if: inputs.full
    runs-on: ubuntu-latest
    # The plan puts the batch readers' slice at about 329 s of job and the others at about 340 s
    # (2026-10-06 table, 16 s of job setup included), 57% of this timeout.
    timeout-minutes: 10
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base }}
          fetch-depth: 0
      - name: Assemble the train's tree
        if: inputs.heads != ''
        env:
          BASE: ${{ inputs.base }}
          HEADS: ${{ inputs.heads }}
          TREE: ${{ inputs.tree }}
        run: node scripts/train.mjs assemble --base "$BASE" --heads "$HEADS" --tree "$TREE"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: npm cache
        if: inputs.save-caches
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: npm cache, restore only
        if: ${{ !inputs.save-caches }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - name: Seeded sim batch, one slice
        run: npm run check -- --tier sim --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      # Fail fast on a PR, as in static above.
      - name: Fail fast, cancel the rest of this PR run
        if: failure() && inputs.fail-fast && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RED_JOB: sim (${{ matrix.shard }}/${{ strategy.job-total }})
        run: |
          echo "::error title=fail-fast::$RED_JOB failed, so it cancels the rest of this PR run; it shows as cancelled too. The gate's log names its failing tests."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || echo "::notice title=fail-fast::could not cancel run $GITHUB_RUN_ID (a fork's read-only token?); the other jobs run on"

  # The browser tests in parallel slices, split the same way by spec file. Each slice builds and
  # tests its own build. The last slice then runs perf on that same build, after its own e2e files,
  # as perf always has (on a fresh runner, perf printed slower ink-look frame times: #166, reverted
  # in #176); the slice plan gives that slice fewer e2e seconds to make room. With fail-fast off (a
  # push to main, a train) a red slice never hides another's result; on a PR the first red job
  # cancels the run (see static). Full suite only. [default]
  # Eight slices since 2026-10-06: with seven, the plan counted test seconds only, and slices planned
  # at 355 s took 410 to 573 s as jobs (setup, the Chromium install and the build add 37 to 70 s;
  # runs 37439710625, 37442774709). The plan now puts each at about 328 s of job (2026-10-06 table,
  # 47 s of job setup included), 55% of this timeout.
  browser:
    name: browser (${{ matrix.shard }}/${{ strategy.job-total }})
    if: inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base }}
          fetch-depth: 0
      - name: Assemble the train's tree
        if: inputs.heads != ''
        env:
          BASE: ${{ inputs.base }}
          HEADS: ${{ inputs.heads }}
          TREE: ${{ inputs.tree }}
        run: node scripts/train.mjs assemble --base "$BASE" --heads "$HEADS" --tree "$TREE"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: npm cache
        if: inputs.save-caches
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: npm cache, restore only
        if: ${{ !inputs.save-caches }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      # Keyed by the browser builds Playwright pins, so a lock-file change alone keeps the cache.
      - name: Playwright browser cache
        if: inputs.save-caches
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - name: Playwright browser cache, restore only
        if: ${{ !inputs.save-caches }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      # Chromium's system packages (fonts, mesa) come from the Ubuntu mirror, which sometimes crawls:
      # 32 MB took 7.5 minutes at 72 kB/s on 2026-10-01, and 299 s in another run. Their .deb files
      # are kept between runs and put in apt's own archive folder, so apt installs the same packages
      # and downloads only what changed. The kept set is saved again (from slice 1, never by a
      # train) only when it differs from the one restored.
      - name: Chromium system packages, restore
        id: debs
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/playwright-debs
          key: playwright-debs-${{ runner.os }}-restore
          restore-keys: playwright-debs-${{ runner.os }}-
      - name: Install Chromium and its system packages
        id: install
        run: |
          mkdir -p ~/.cache/playwright-debs
          if ls ~/.cache/playwright-debs/*.deb > /dev/null 2>&1; then
            sudo cp ~/.cache/playwright-debs/*.deb /var/cache/apt/archives/
          fi
          npx playwright install --with-deps --only-shell chromium
          rm -rf ~/.cache/playwright-debs && mkdir -p ~/.cache/playwright-debs
          for f in /var/cache/apt/archives/*.deb; do
            [ -e "$f" ] || continue
            p=$(dpkg-deb -f "$f" Package)
            if [ "$(dpkg-query -W -f='${Version}' "$p" 2>/dev/null)" = "$(dpkg-deb -f "$f" Version)" ]; then
              cp "$f" ~/.cache/playwright-debs/
            fi
          done
          echo "kept $(ls ~/.cache/playwright-debs | wc -l) .deb files"
          echo "key=playwright-debs-${RUNNER_OS}-$(ls ~/.cache/playwright-debs | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Chromium system packages, save
        if: inputs.save-caches && matrix.shard == 1 && steps.install.outputs.key != steps.debs.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/playwright-debs
          key: ${{ steps.install.outputs.key }}
      - name: Build, browser tests (one slice)
        if: matrix.shard != strategy.job-total
        run: npm run check -- --tier browser --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Build, browser tests (the last slice), then perf on the same build
        if: matrix.shard == strategy.job-total
        run: npm run check -- --tier browser,perf --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}screenshots-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Keep the tested build for the deploy
        if: inputs.upload-dist && matrix.shard == strategy.job-total
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error
      # Fail fast on a PR, as in static above.
      - name: Fail fast, cancel the rest of this PR run
        if: failure() && inputs.fail-fast && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RED_JOB: browser (${{ matrix.shard }}/${{ strategy.job-total }})
        run: |
          echo "::error title=fail-fast::$RED_JOB failed, so it cancels the rest of this PR run; it shows as cancelled too. The gate's log names its failing tests."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || echo "::notice title=fail-fast::could not cancel run $GITHUB_RUN_ID (a fork's read-only token?); the other jobs run on"
