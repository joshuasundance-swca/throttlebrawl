# Re-run a red main once (docs/engineering.md, "CI on GitHub Actions"). When a push run of ci on
# main ends red on its FIRST attempt, and that commit is still main's head, this re-runs its failed
# jobs once (GitHub re-runs their dependents too: gate, then deploy-prod and release when it goes
# green). Red is a failed run, or a run cancelled only because a job hit its timeout-minutes: GitHub
# ends a timed-out job cancelled and the run with it (main run 37423758824, 2026-10-06, was never
# re-run while this acted on failure alone). A run a person cancelled, or a waiting run a newer
# push replaced, is left alone. It never re-runs a re-run, and it never re-runs a PR's run. Every
# decision is logged in the run's summary and as a notice, so `gh run list --workflow
# rerun-main.yml` is the flake ledger: a rescue there is a flaky test or a slow slice somebody
# should still fix, not a cure. The decision is scripts/rerun-main.mjs (rerunDecision), tested in
# scripts/rerun-main.test.ts.
#
# Why: on 2026-10-02, 13 main push runs went red on the first try, 3 of them pure flakes by the
# strategy review's count. On 10-03, b86069b went red on a one-step frame-time jitter (p95 149.9
# against 141.5) on a tree whose PR run had passed, and main stayed red for 42 minutes, until the
# next merge's run. A failed-jobs re-run costs 1 to 3 jobs.
#
# Only when the commit is still main's head: a newer push has its own run, which decides main's
# colour. Re-running an older commit would also queue in ci's concurrency group, where GitHub keeps
# one waiting run and the newest queued replaces it, so it could cancel the newer commit's waiting
# run. On 10-02's runs this rule would have fired on 5 of the 13 red runs; the other 8 had a newer
# main commit by the time they finished. [default] (a must-take of the 2026-10-03 strategy review.)
#
# It runs main's own scripts/ (a workflow_run event checks out main's newest commit), never the
# judged run's code, and no PR text reaches a run: line. The token can re-run workflows
# (actions: write), read the judged jobs' annotations, which tell a timeout from a cancel
# (checks: read), and read the repo (contents: read), nothing more. A cancelled main run now
# starts this job too, including a waiting run that a newer push replaced: about half a minute
# of one runner, which then logs "not re-run".
name: rerun-main

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  rerun:
    name: re-run main's red jobs once
    # Skipped jobs take no runner: green runs, PR runs and later attempts stop here.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      checks: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - name: Re-run once, if this is still main's head, its red is a failure or a timeout, and nobody re-ran it yet
        run: node scripts/rerun-main.mjs
