# The gate (docs/engineering.md, "CI on GitHub Actions" and "The bundle train"). The suite itself
# (static, unit in two slices, sim in six, browser in seven with perf in the last) lives in
# suite.yml, shared with the bundle train (train.yml) so the two can never drift. `gate` is the
# single required status check.
#
# On a pull request, `route` (scripts/train.mjs) picks the PR's path:
# - full: the full suite on this PR, and the aggregate is the PR's `gate`: forks, Dependabot, the
#   "[full-gate]" escape hatch (in the title, or alone on a line of the body) and PRs that change
#   .github/ (a train runs main's workflows, not the PR's), and while the train is off (.github/train.json, "live": false) every PR but a
#   docs-only one. Only this path records the tree it tested, for main's skip path (below).
# - train: the quick check (static plus the build and its size budget, and the two unit slices).
#   Its aggregate is named `quick`, never `gate`, so auto-merge waits for the train, which runs the
#   full suite once on a bundle of ready PRs and posts `gate` as a commit status on each head.
# - docs: the same quick check, and its aggregate is the PR's `gate` (no sim or browser tier
#   needed), with the train on or off. Docs-only means docs/, changes/ and .md files, but never one
#   the build or a deploy reads (README.md, space/, THIRD_PARTY_ASSETS.md; scripts/train.mjs SHIPS).
# One source of `gate` per head commit: this workflow's aggregate job, or the train's status. The
# train's notes on a waiting PR (why it waits) use their own context, `train`, which no rule requires.
#
# On a push to main: the full suite, then (green) deploy to the game Space and the release notes:
# the backstop after every landing. A push whose tree a green full-path PR run already tested skips
# that suite: `plan` finds the PR run's record, `prod-build` runs the push-only identity leak scan,
# builds with the prod stamp and boots that build, and the aggregate accepts the skipped suite on
# that path only (scripts/tested-tree.mjs).
# No `paths:` filter: a required check behind one never reports on some PRs. Path awareness is the
# route job's.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read by prod-build; the suite gets the same values as inputs (a called workflow does not inherit
# this env).
env:
  BUILD_ID: ${{ github.event.pull_request.head.sha || github.sha }}
  BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
  BUILD_CHANNEL: ${{ github.event_name == 'push' && 'prod' || 'dev' }}
  # Author and committer of the PR's own commits (never HEAD, the synthetic merge commit), or on
  # a push to main the squash commit GitHub just made.
  LEAKSCAN_IDENTITY_RANGE: ${{ github.event_name == 'pull_request' && format('origin/main..{0}', github.event.pull_request.head.sha) || 'HEAD~1..HEAD' }}
  # Who opened the PR, from the event (a branch cannot set it). notes:check exempts a PR only
  # when this is dependabot[bot] and every commit on it is Dependabot's (scripts/notes.mjs).
  NOTES_PR_AUTHOR: ${{ github.event.pull_request.user.login }}

jobs:
  # Push to main only: was this exact tree already tested by a green PR run? Every such run's gate
  # recorded the tree of the merge commit it tested (below); the squash commit has the same tree
  # whenever main did not move between that run and the merge. Any doubt, an API error included,
  # says skip=false, and the whole suite runs as before. On a PR this job is skipped, and the suite
  # starts at once. [default]
  plan:
    name: tree already tested?
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Look up a green PR run that tested this tree
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/tested-tree.mjs decide

  # Pull request only: which path this PR takes (train, docs or full), from what it changes (its
  # merge commit against main) and who opened it. The PR's title and body reach the script through
  # env, never a run: line. [default]
  route:
    name: route
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      path: ${{ steps.route.outputs.path }}
    steps:
      # The PR's merge commit and its first parent (main), to list what the PR changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          sparse-checkout: |
            scripts
            .github
      - name: Which path this PR takes (train, docs or full)
        id: route
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/train.mjs route

  # The suite (suite.yml, shared with the train): every tier on a push to main and on a PR's full
  # path, the quick check (3 jobs) on the train and docs paths. Skipped on main's skip path. Its
  # jobs show as `suite / static`, `suite / unit (1/2)` and so on. On a PR it fails fast
  # (docs/engineering.md, "Fail fast on a PR"): the first red suite job cancels the rest of this
  # run. Every suite job gets this job's token, so actions: write here is what the cancel needs
  # (contents: read restated: job permissions replace the workflow's). No other job gets it.
  suite:
    needs: [plan, route]
    if: ${{ !cancelled() && (needs.plan.result == 'skipped' || (needs.plan.result == 'success' && needs.plan.outputs.skip != 'true')) && (needs.route.result == 'skipped' || needs.route.result == 'success') }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/suite.yml
    with:
      full: ${{ github.event_name == 'push' || needs.route.outputs.path == 'full' }}
      fail-fast: ${{ github.event_name == 'pull_request' }}
      save-caches: true
      upload-dist: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      build-id: ${{ github.event.pull_request.head.sha || github.sha }}
      build-branch: ${{ github.head_ref || github.ref_name }}
      build-channel: ${{ github.event_name == 'push' && 'prod' || 'dev' }}
      # Author and committer of the PR's own commits (never HEAD, the synthetic merge commit), or
      # on a push to main the squash commit GitHub just made.
      identity-range: ${{ github.event_name == 'pull_request' && format('origin/main..{0}', github.event.pull_request.head.sha) || 'HEAD~1..HEAD' }}
      # Who opened the PR, from the event (a branch cannot set it).
      notes-pr-author: ${{ github.event.pull_request.user.login }}

  # The skip path's push-only work: what the suite would have done that depends on the push, not
  # the tree. The leak scan checks the squash commit's author and committer
  # (LEAKSCAN_IDENTITY_RANGE above; identity is [decided]) and re-scans the tree, which takes
  # seconds. The build is not the PR run's build: it carries the prod stamp and this commit's
  # changelog dates, and the prod channel loads no draft packs (src/app/index.ts, includeDrafts),
  # while every PR run tests a dev build with drafts loaded. So this job boots its own build in
  # Chromium before it can ship (the boot spec: page loads, WebGL2, no console errors or failed
  # requests, a non-blank canvas, the stamp names this commit). Only the boot is re-run here; the
  # races, the other specs and perf ran on the PR's dev build (docs/engineering.md, "Main re-runs
  # the suite only for a tree no green PR run tested"). It uploads the `dist` `deploy-prod` ships.
  prod-build:
    name: prod build (tree already tested)
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Leak scan, with the squash commit's identity
        run: npm run leakscan:all
      - name: Build with the prod stamp
        run: npm run build:dist
      # The same two caches as the browser job (restore only; that job saves them).
      - name: Playwright browser cache, restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - name: Chromium system packages, restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/playwright-debs
          key: playwright-debs-${{ runner.os }}-restore
          restore-keys: playwright-debs-${{ runner.os }}-
      - name: Install Chromium and its system packages
        run: |
          if ls ~/.cache/playwright-debs/*.deb > /dev/null 2>&1; then
            sudo cp ~/.cache/playwright-debs/*.deb /var/cache/apt/archives/
          fi
          npx playwright install --with-deps --only-shell chromium
      - name: Boot the prod build (drafts off) before it ships
        run: |
          export E2E_EXPECT_STAMP="${GITHUB_SHA::7}"
          npx playwright test --project=e2e tests/e2e/boot.spec.ts
      - name: Screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-prod-build
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Keep the build for the deploy
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # The aggregate: named `gate` (the one required check) on main and on a PR's docs and full paths,
  # and `quick` on the train path, where the train posts `gate`. Its job id is not `gate`, so no
  # placeholder name can ever read as one. Green on exactly two shapes (scripts/tested-tree.mjs
  # gateVerdict): the suite path, where the suite succeeded; or the skip path, only when `plan`
  # said this tree was tested, where the suite was skipped and prod-build succeeded. A failed,
  # cancelled or missing job fails it on either path. On a PR's full path, a green gate records the
  # tree it tested as an artifact named `tested-tree-<tree>` (7 days), which is what `plan` looks
  # up on main; the quick check never records one, since it did not run the full suite. The record
  # step cannot turn a PR red: if it fails, main just runs the whole suite.
  # When the verdict is red, the aggregate names the red suite jobs, their failed steps and their
  # failing tests (from their logs) in its own log, its summary and its annotations. Fail fast leaves
  # the red job `cancelled` like its siblings, and `gh run view --log-failed` prints only this job's
  # log (docs/engineering.md, "Fail fast on a PR"). Reading the run's jobs and logs takes
  # actions: read; contents: read is restated, since job permissions replace the workflow's.
  aggregate:
    name: ${{ needs.route.outputs.path == 'train' && 'quick' || 'gate' }}
    needs: [plan, route, suite, prod-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Every gate job passed, on the suite path or the skip path
        id: verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          ROUTE: ${{ needs.route.outputs.path }}
        run: |
          echo "path: ${ROUTE:-push to main}"
          node scripts/tested-tree.mjs gate
      # It fails on purpose, whatever the naming does (the gate is red already): `gh run view
      # --log-failed` prints only failed steps.
      - name: Red, so name the red jobs and their failing tests
        if: failure() && steps.verdict.outcome == 'failure'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/train.mjs failures || true
          exit 1
      # The checkout is the commit this run tested: on a PR, GitHub's merge of the head into main.
      - name: Record the tree this PR run tested
        id: record
        if: github.event_name == 'pull_request' && needs.route.outputs.path == 'full'
        continue-on-error: true
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          mkdir -p "$RUNNER_TEMP/tested-tree"
          printf '{"tree":"%s","commit":"%s","prHead":"%s","run":%s}\n' "$tree" "$GITHUB_SHA" \
            "$PR_HEAD" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/tested-tree/tested-tree.json"
          cat "$RUNNER_TEMP/tested-tree/tested-tree.json"
          echo "name=tested-tree-$tree" >> "$GITHUB_OUTPUT"
      - name: Upload the record
        if: github.event_name == 'pull_request' && steps.record.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.record.outputs.name }}
          path: ${{ runner.temp }}/tested-tree/tested-tree.json
          retention-days: 7
          overwrite: true

  # Every green push to main uploads its build ([decided]: every green merge goes live): on the
  # suite path the build its own browser tier tested; on the skip path the prod build that
  # `prod-build` booted. The `if:` must start with a status function: a job skipped by its own
  # `if:` (prod-build on the suite path, the suite on the skip path) is always upstream of this one,
  # and without one GitHub adds success(), which reads every ancestor and skips this job
  # (actions/runner#2205). release below has the same rule (scripts/tested-tree.test.ts checks it). Main push runs are serialised by the workflow's concurrency group (never cancelled
  # in progress; a newer push replaces only a run still waiting), so first attempts finish in push
  # order and each deploy is newer than the last. The check skips only when prod already serves a
  # newer main commit, as on a re-run of an old run. The old rule, "upload only if still main's
  # head", starved prod while merges landed faster than one CI run: 39 of 59 green main runs
  # skipped their upload on 2026-09-30/10-01, and prod sat on one build for up to 145 minutes.
  # [default]
  deploy-prod:
    name: deploy-prod
    needs: [aggregate]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.aggregate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Deploy this run's build? (skip only if prod serves a newer main commit)
        id: decide
        env:
          SPACE: ${{ vars.HF_SPACE_PROD }}
        run: node scripts/prod-deploy-check.mjs --sha "$GITHUB_SHA" --space "$SPACE"
      - uses: actions/download-artifact@v8
        if: steps.decide.outputs.deploy == 'true'
        with:
          name: dist
          path: dist/
      - name: Stage the source mirror plus the build
        if: steps.decide.outputs.deploy == 'true'
        run: node scripts/space-stage.mjs --out .cache/space --readme space/README.prod.md
      - name: Upload to the game Space
        if: steps.decide.outputs.deploy == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: ${{ vars.HF_SPACE_PROD }}
        # The hf CLI's version is pinned in .github/deploy/requirements.txt, where Dependabot sees it.
        run: |
          python3 -m venv "$RUNNER_TEMP/hf"
          "$RUNNER_TEMP/hf/bin/pip" install --quiet --disable-pip-version-check -r .github/deploy/requirements.txt
          "$RUNNER_TEMP/hf/bin/hf" upload "$SPACE" .cache/space . --repo-type space --delete "*" \
            --commit-message "deploy ${GITHUB_SHA::7}"

  release:
    name: release
    needs: [deploy-prod]
    if: ${{ !cancelled() && needs.deploy-prod.result == 'success' && needs.deploy-prod.outputs.deployed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Player notes since the last release
        id: notes
        run: node scripts/release-notes.mjs --out .cache/release-notes.md
      - name: Create the release
        if: steps.notes.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file .cache/release-notes.md
