# The gate (docs/engineering.md, "CI on GitHub Actions"). static, unit and browser run in
# parallel, each running its tier of `npm run check`; `gate` is the single required status check.
# On a push to main, a green gate deploys to the game Space and writes the release notes.
# No `paths:` filter: a required check behind one never reports on some PRs.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_ID: ${{ github.event.pull_request.head.sha || github.sha }}
  BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
  BUILD_CHANNEL: ${{ github.event_name == 'push' && 'prod' || 'dev' }}
  # Author and committer of the PR's own commits (never HEAD, the synthetic merge commit), or on
  # a push to main the squash commit GitHub just made.
  LEAKSCAN_IDENTITY_RANGE: ${{ github.event_name == 'pull_request' && format('origin/main..{0}', github.event.pull_request.head.sha) || 'HEAD~1..HEAD' }}
  # Who opened the PR, from the event (a branch cannot set it). notes:check exempts a PR only
  # when this is dependabot[bot] and every commit on it is Dependabot's (scripts/notes.mjs).
  NOTES_PR_AUTHOR: ${{ github.event.pull_request.user.login }}

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit signatures
      - name: Types, lint, format, packs, leak scan, size, notes
        run: npm run check -- --tier static

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit tests and the seeded sim batch
        run: npm run check -- --tier unit

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Build, browser tests, perf
        run: npm run check -- --tier browser
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Keep the tested build for the deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  gate:
    name: gate
    needs: [static, unit, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every gate job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  deploy-prod:
    name: deploy-prod
    needs: [gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.head.outputs.current }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Is this still the head of main?
        id: head
        run: |
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main moved on to ${head::7}; a newer run deploys it. Skipping the upload."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.head.outputs.current == 'true'
        with:
          name: dist
          path: dist/
      - name: Stage the source mirror plus the build
        if: steps.head.outputs.current == 'true'
        run: node scripts/space-stage.mjs --out .cache/space --readme space/README.prod.md
      - name: Upload to the game Space
        if: steps.head.outputs.current == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: ${{ vars.HF_SPACE_PROD }}
        # The hf CLI's version is pinned in .github/deploy/requirements.txt, where Dependabot sees it.
        run: |
          python3 -m venv "$RUNNER_TEMP/hf"
          "$RUNNER_TEMP/hf/bin/pip" install --quiet --disable-pip-version-check -r .github/deploy/requirements.txt
          "$RUNNER_TEMP/hf/bin/hf" upload "$SPACE" .cache/space . --repo-type space --delete "*" \
            --commit-message "deploy ${GITHUB_SHA::7}"

  release:
    name: release
    needs: [deploy-prod]
    if: needs.deploy-prod.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Player notes since the last release
        id: notes
        run: node scripts/release-notes.mjs --out .cache/release-notes.md
      - name: Create the release
        if: steps.notes.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file .cache/release-notes.md
