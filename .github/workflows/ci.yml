# The gate (docs/engineering.md, "CI on GitHub Actions" and "The bundle train").
#
# On a pull request, `route` (scripts/train.mjs) picks the PR's path:
# - train: the quick check (static and unit, plus the build and its size budget). Its aggregate
#   job is named `quick`, never `gate`, so auto-merge waits for the train (train.yml), which runs
#   the full suite once on a bundle of ready PRs and posts `gate` as a commit status on each head.
# - docs: the same quick check, and it is the PR's `gate` (no sim or browser tier needed).
# - full: the full suite on this PR, and it is the PR's `gate`: forks, Dependabot, the
#   "[full-gate]" escape hatch, PRs that change .github/ (a train runs main's workflows, not the
#   PR's), and every PR while the train is off (.github/train.json).
# One source of `gate` per head commit: this workflow's aggregate job, or the train's status.
#
# On a push to main: the full suite, then (green) deploy to the game Space and the release notes,
# unchanged by the train: the backstop after every landing.
# The suite itself lives in suite.yml, shared with the train so the two never drift.
# No `paths:` filter: a required check behind one never reports on some PRs. Path awareness is the
# route job's.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    name: route
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      path: ${{ steps.route.outputs.path }}
    steps:
      # The PR's merge commit and its first parent (main), to list what the PR changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Which path this PR takes (train, docs or full)
        id: route
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/train.mjs route

  suite:
    needs: route
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.route.result == 'success') }}
    uses: ./.github/workflows/suite.yml
    with:
      full: ${{ github.event_name == 'push' || needs.route.outputs.path == 'full' }}
      save-caches: true
      upload-dist: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      build-id: ${{ github.event.pull_request.head.sha || github.sha }}
      build-branch: ${{ github.head_ref || github.ref_name }}
      build-channel: ${{ github.event_name == 'push' && 'prod' || 'dev' }}
      # Author and committer of the PR's own commits (never HEAD, the synthetic merge commit), or
      # on a push to main the squash commit GitHub just made.
      identity-range: ${{ github.event_name == 'pull_request' && format('origin/main..{0}', github.event.pull_request.head.sha) || 'HEAD~1..HEAD' }}
      notes-pr-author: ${{ github.event.pull_request.user.login }}

  # `gate` (the one required check) for the docs and full paths and on main; `quick` for a PR that
  # waits for the train. The job id is not `gate`, so no placeholder name can ever read as one.
  aggregate:
    name: ${{ needs.route.outputs.path == 'train' && 'quick' || 'gate' }}
    needs: [route, suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          ROUTE: ${{ needs.route.outputs.path }}
        run: |
          echo "path: ${ROUTE:-main push}"
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.suite.result == "success" and (.route.result == "success" or .route.result == "skipped")' > /dev/null

  # Every green push to main uploads the build its own gate tested ([decided]: every green merge
  # goes live). Main push runs are serialised by the workflow's concurrency group (never cancelled
  # in progress; a newer push replaces only a run still waiting), so first attempts finish in push
  # order and each deploy is newer than the last. The check skips only when prod already serves a
  # newer main commit, as on a re-run of an old run. The old rule, "upload only if still main's
  # head", starved prod while merges landed faster than one CI run: 39 of 59 green main runs
  # skipped their upload on 2026-09-30/10-01, and prod sat on one build for up to 145 minutes.
  # [default]
  deploy-prod:
    name: deploy-prod
    needs: [aggregate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.aggregate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Deploy this run's build? (skip only if prod serves a newer main commit)
        id: decide
        env:
          SPACE: ${{ vars.HF_SPACE_PROD }}
        run: node scripts/prod-deploy-check.mjs --sha "$GITHUB_SHA" --space "$SPACE"
      - uses: actions/download-artifact@v8
        if: steps.decide.outputs.deploy == 'true'
        with:
          name: dist
          path: dist/
      - name: Stage the source mirror plus the build
        if: steps.decide.outputs.deploy == 'true'
        run: node scripts/space-stage.mjs --out .cache/space --readme space/README.prod.md
      - name: Upload to the game Space
        if: steps.decide.outputs.deploy == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: ${{ vars.HF_SPACE_PROD }}
        # The hf CLI's version is pinned in .github/deploy/requirements.txt, where Dependabot sees it.
        run: |
          python3 -m venv "$RUNNER_TEMP/hf"
          "$RUNNER_TEMP/hf/bin/pip" install --quiet --disable-pip-version-check -r .github/deploy/requirements.txt
          "$RUNNER_TEMP/hf/bin/hf" upload "$SPACE" .cache/space . --repo-type space --delete "*" \
            --commit-message "deploy ${GITHUB_SHA::7}"

  release:
    name: release
    needs: [deploy-prod]
    if: needs.deploy-prod.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Player notes since the last release
        id: notes
        run: node scripts/release-notes.mjs --out .cache/release-notes.md
      - name: Create the release
        if: steps.notes.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file .cache/release-notes.md
