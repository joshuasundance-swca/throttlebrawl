# The gate (docs/engineering.md, "CI on GitHub Actions"). static and unit (one job), sim (four
# slices) and browser (four slices, the last also running perf) run in parallel, each running its
# tiers of `npm run check`; `gate` is the single required status check, and it fails unless every
# one of them succeeded.
# On a push to main, a green gate deploys to the game Space and writes the release notes. A push
# whose tree a green PR run already tested skips that suite: `plan` finds the PR run's record,
# `prod-build` runs the push-only identity leak scan, builds with the prod stamp and boots that
# build, and the gate accepts the skipped suite on that path only (scripts/tested-tree.mjs).
# No `paths:` filter: a required check behind one never reports on some PRs.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_ID: ${{ github.event.pull_request.head.sha || github.sha }}
  BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
  BUILD_CHANNEL: ${{ github.event_name == 'push' && 'prod' || 'dev' }}
  # Author and committer of the PR's own commits (never HEAD, the synthetic merge commit), or on
  # a push to main the squash commit GitHub just made.
  LEAKSCAN_IDENTITY_RANGE: ${{ github.event_name == 'pull_request' && format('origin/main..{0}', github.event.pull_request.head.sha) || 'HEAD~1..HEAD' }}
  # Who opened the PR, from the event (a branch cannot set it). notes:check exempts a PR only
  # when this is dependabot[bot] and every commit on it is Dependabot's (scripts/notes.mjs).
  NOTES_PR_AUTHOR: ${{ github.event.pull_request.user.login }}

jobs:
  # Push to main only: was this exact tree already tested by a green PR run? Every such run's gate
  # recorded the tree of the merge commit it tested (below); the squash commit has the same tree
  # whenever main did not move between that run and the merge. Any doubt, an API error included,
  # says skip=false, and the whole suite runs as before. On a PR this job is skipped, and the suite
  # starts at once. [default]
  plan:
    name: tree already tested?
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Look up a green PR run that tested this tree
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/tested-tree.mjs decide

  # The static checks, then the unit tests, in one job: together they finish well inside the
  # browser slices' time, and one job sets up one runner instead of two. [default]
  static-unit:
    name: static and unit
    needs: [plan]
    if: ${{ !cancelled() && (needs.plan.result == 'skipped' || (needs.plan.result == 'success' && needs.plan.outputs.skip != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit signatures
      - name: Types, lint, format, packs, leak scan, size, notes, then the unit tests
        run: npm run check -- --tier static,unit

  # The seeded sim batch in parallel slices. The test runner lists the files and
  # scripts/shard-plan.mjs splits them by their measured CI seconds (tests/timings.json): every file
  # lands in exactly one slice, so the slices' test counts add up to the unsharded run's, and the
  # files that read the shared seeded batch share one slice, so it is computed once. fail-fast is
  # off so a red slice never hides the other's result. [default]
  # Four slices since 2026-10-03: with three, the slices' last 15 green runs had medians of 7.9 to
  # 9.3 minutes and a max of 9.8 against the 10-minute limit.
  sim:
    name: sim (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [plan]
    if: ${{ !cancelled() && (needs.plan.result == 'skipped' || (needs.plan.result == 'success' && needs.plan.outputs.skip != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Seeded sim batch, one slice
        run: npm run check -- --tier sim --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # The browser tests in parallel slices, split the same way by spec file. Each slice builds and
  # tests its own build. The last slice then runs perf on that same build, after its own e2e files,
  # as perf always has (on a fresh runner, perf printed slower ink-look frame times: #166, reverted
  # in #176); the slice plan gives that slice fewer e2e seconds to make room. fail-fast is off so a
  # red slice never hides another's result. [default]
  browser:
    name: browser (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [plan]
    if: ${{ !cancelled() && (needs.plan.result == 'skipped' || (needs.plan.result == 'success' && needs.plan.outputs.skip != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Keyed by the browser builds Playwright pins, so a lock-file change alone keeps the cache.
      - name: Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      # Chromium's system packages (fonts, mesa) come from the Ubuntu mirror, which sometimes crawls:
      # 32 MB took 7.5 minutes at 72 kB/s on 2026-10-01, and 299 s in another run. Their .deb files
      # are kept between runs and put in apt's own archive folder, so apt installs the same packages
      # and downloads only what changed. The kept set is saved again (from slice 1) only when it
      # differs from the one restored.
      - name: Chromium system packages, restore
        id: debs
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/playwright-debs
          key: playwright-debs-${{ runner.os }}-restore
          restore-keys: playwright-debs-${{ runner.os }}-
      - name: Install Chromium and its system packages
        id: install
        run: |
          mkdir -p ~/.cache/playwright-debs
          if ls ~/.cache/playwright-debs/*.deb > /dev/null 2>&1; then
            sudo cp ~/.cache/playwright-debs/*.deb /var/cache/apt/archives/
          fi
          npx playwright install --with-deps --only-shell chromium
          rm -rf ~/.cache/playwright-debs && mkdir -p ~/.cache/playwright-debs
          for f in /var/cache/apt/archives/*.deb; do
            [ -e "$f" ] || continue
            p=$(dpkg-deb -f "$f" Package)
            if [ "$(dpkg-query -W -f='${Version}' "$p" 2>/dev/null)" = "$(dpkg-deb -f "$f" Version)" ]; then
              cp "$f" ~/.cache/playwright-debs/
            fi
          done
          echo "kept $(ls ~/.cache/playwright-debs | wc -l) .deb files"
          echo "key=playwright-debs-${RUNNER_OS}-$(ls ~/.cache/playwright-debs | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Chromium system packages, save
        if: matrix.shard == 1 && steps.install.outputs.key != steps.debs.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/playwright-debs
          key: ${{ steps.install.outputs.key }}
      - name: Build, browser tests (one slice)
        if: matrix.shard != strategy.job-total
        run: npm run check -- --tier browser --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Build, browser tests (the last slice), then perf on the same build
        if: matrix.shard == strategy.job-total
        run: npm run check -- --tier browser,perf --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Keep the tested build for the deploy
        if: matrix.shard == strategy.job-total && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # The skip path's push-only work: what the suite would have done that depends on the push, not
  # the tree. The leak scan checks the squash commit's author and committer
  # (LEAKSCAN_IDENTITY_RANGE above; identity is [decided]) and re-scans the tree, which takes
  # seconds. The build is not the PR run's build: it carries the prod stamp and this commit's
  # changelog dates, and the prod channel loads no draft packs (src/app/index.ts, includeDrafts),
  # while every PR run tests a dev build with drafts loaded. So this job boots its own build in
  # Chromium before it can ship (the boot spec: page loads, WebGL2, no console errors or failed
  # requests, a non-blank canvas, the stamp names this commit). Only the boot is re-run here; the
  # races, the other specs and perf ran on the PR's dev build (docs/engineering.md, "Main re-runs
  # the suite only for a tree no green PR run tested"). It uploads the `dist` `deploy-prod` ships.
  prod-build:
    name: prod build (tree already tested)
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Leak scan, with the squash commit's identity
        run: npm run leakscan:all
      - name: Build with the prod stamp
        run: npm run build:dist
      # The same two caches as the browser job (restore only; that job saves them).
      - name: Playwright browser cache, restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - name: Chromium system packages, restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/playwright-debs
          key: playwright-debs-${{ runner.os }}-restore
          restore-keys: playwright-debs-${{ runner.os }}-
      - name: Install Chromium and its system packages
        run: |
          if ls ~/.cache/playwright-debs/*.deb > /dev/null 2>&1; then
            sudo cp ~/.cache/playwright-debs/*.deb /var/cache/apt/archives/
          fi
          npx playwright install --with-deps --only-shell chromium
      - name: Boot the prod build (drafts off) before it ships
        run: |
          export E2E_EXPECT_STAMP="${GITHUB_SHA::7}"
          npx playwright test --project=e2e tests/e2e/boot.spec.ts
      - name: Screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-prod-build
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Keep the build for the deploy
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # Green on exactly two shapes (scripts/tested-tree.mjs gateVerdict): the suite path, where every
  # suite job succeeded; or the skip path, only when `plan` said this tree was tested, where every
  # suite job was skipped and prod-build succeeded. A failed, cancelled or missing job fails it on
  # either path. On a PR, a green gate records the tree it tested as an artifact named
  # `tested-tree-<tree>` (7 days), which is what `plan` looks up on main. The record step cannot
  # turn a PR red: if it fails, main just runs the whole suite.
  gate:
    name: gate
    needs: [plan, static-unit, sim, browser, prod-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Every gate job passed, on the suite path or the skip path
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/tested-tree.mjs gate
      # The checkout is the commit this run tested: on a PR, GitHub's merge of the head into main.
      - name: Record the tree this PR run tested
        id: record
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          mkdir -p "$RUNNER_TEMP/tested-tree"
          printf '{"tree":"%s","commit":"%s","prHead":"%s","run":%s}\n' "$tree" "$GITHUB_SHA" \
            "$PR_HEAD" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/tested-tree/tested-tree.json"
          cat "$RUNNER_TEMP/tested-tree/tested-tree.json"
          echo "name=tested-tree-$tree" >> "$GITHUB_OUTPUT"
      - name: Upload the record
        if: github.event_name == 'pull_request' && steps.record.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.record.outputs.name }}
          path: ${{ runner.temp }}/tested-tree/tested-tree.json
          retention-days: 7
          overwrite: true

  # Every green push to main uploads its build ([decided]: every green merge goes live): on the
  # suite path the build its own browser tier tested; on the skip path the prod build that
  # `prod-build` booted. The `if:` must start with a status function: a job skipped by its own
  # `if:` (prod-build on the suite path, the suite on the skip path) is always upstream of this one,
  # and without one GitHub adds success(), which reads every ancestor and skips this job
  # (actions/runner#2205). release below has the same rule (scripts/tested-tree.test.ts checks it). Main push runs are serialised by the workflow's concurrency group (never cancelled
  # in progress; a newer push replaces only a run still waiting), so first attempts finish in push
  # order and each deploy is newer than the last. The check skips only when prod already serves a
  # newer main commit, as on a re-run of an old run. The old rule, "upload only if still main's
  # head", starved prod while merges landed faster than one CI run: 39 of 59 green main runs
  # skipped their upload on 2026-09-30/10-01, and prod sat on one build for up to 145 minutes.
  # [default]
  deploy-prod:
    name: deploy-prod
    needs: [gate]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Deploy this run's build? (skip only if prod serves a newer main commit)
        id: decide
        env:
          SPACE: ${{ vars.HF_SPACE_PROD }}
        run: node scripts/prod-deploy-check.mjs --sha "$GITHUB_SHA" --space "$SPACE"
      - uses: actions/download-artifact@v8
        if: steps.decide.outputs.deploy == 'true'
        with:
          name: dist
          path: dist/
      - name: Stage the source mirror plus the build
        if: steps.decide.outputs.deploy == 'true'
        run: node scripts/space-stage.mjs --out .cache/space --readme space/README.prod.md
      - name: Upload to the game Space
        if: steps.decide.outputs.deploy == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: ${{ vars.HF_SPACE_PROD }}
        # The hf CLI's version is pinned in .github/deploy/requirements.txt, where Dependabot sees it.
        run: |
          python3 -m venv "$RUNNER_TEMP/hf"
          "$RUNNER_TEMP/hf/bin/pip" install --quiet --disable-pip-version-check -r .github/deploy/requirements.txt
          "$RUNNER_TEMP/hf/bin/hf" upload "$SPACE" .cache/space . --repo-type space --delete "*" \
            --commit-message "deploy ${GITHUB_SHA::7}"

  release:
    name: release
    needs: [deploy-prod]
    if: ${{ !cancelled() && needs.deploy-prod.result == 'success' && needs.deploy-prod.outputs.deployed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Player notes since the last release
        id: notes
        run: node scripts/release-notes.mjs --out .cache/release-notes.md
      - name: Create the release
        if: steps.notes.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file .cache/release-notes.md
