# Staging (docs/engineering.md, "CI on GitHub Actions"): every push to a branch other than main
# runs the leak scan and size check, builds, boot-tests the build and deploys it to the staging
# Space as the same source mirror plus dist/ that prod gets. The newest push wins. It does not wait
# for the full gate: staging is for playing work in progress, and its stamp names branch and commit.
# Dependabot branches never deploy: their runs get no repository secrets (so the upload would fail),
# and because this workflow's concurrency cancels older runs, a bump would knock a person's build
# off the staging Space. They are ignored here, before a run exists, not skipped inside the job.
name: staging

on:
  push:
    branches-ignore: [main, 'dependabot/**']
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to put on the staging Space
        required: true

permissions:
  contents: read

concurrency:
  group: staging-space
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: deploy-staging
    # A second guard, in case a Dependabot push ever lands outside dependabot/**.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILD_CHANNEL: staging
      BUILD_BRANCH: ${{ inputs.branch || github.ref_name }}
      LEAKSCAN_IDENTITY_RANGE: origin/main..HEAD
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build id
        run: echo "BUILD_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: npm run leakscan:all
      - run: npm run sizecheck
      - run: npm run build
      # Keyed by the browser builds Playwright pins, as in suite.yml.
      - name: Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - run: npx playwright install --with-deps --only-shell chromium
      # The boot spec only (about 11 s on CI): the page loads, WebGL2 exists, no console errors, the
      # canvas is not blank. It used to run every e2e spec (45 files, 2564 s of measured test time
      # in tests/timings.json), so a newer push cancelled nearly every run before it deployed: 160
      # of the 161 runs between 01:25Z and 18:19Z on 2026-10-02 were cancelled (the other failed),
      # and staging last deployed at 2026-10-01 20:21Z. The full browser tier runs in the gate.
      # [default]
      - name: Boot smoke test
        run: npx playwright test --project=e2e tests/e2e/boot.spec.ts
      - name: Stage the source mirror plus the build
        run: node scripts/space-stage.mjs --out .cache/space --readme space/README.staging.md
      - name: Upload to the staging Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: ${{ vars.HF_SPACE_STAGING }}
        # The hf CLI's version is pinned in .github/deploy/requirements.txt, where Dependabot sees it.
        run: |
          python3 -m venv "$RUNNER_TEMP/hf"
          "$RUNNER_TEMP/hf/bin/pip" install --quiet --disable-pip-version-check -r .github/deploy/requirements.txt
          "$RUNNER_TEMP/hf/bin/hf" upload "$SPACE" .cache/space . --repo-type space --delete "*" \
            --commit-message "deploy ${BUILD_ID::7} from ${BUILD_BRANCH}"
