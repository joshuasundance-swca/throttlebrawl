[project]
name = "throttlebrawl-gis"
version = "0.1.0"
description = "Offline GIS bake for throttlebrawl: real roads from public data into the baked road format."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "numpy>=2.2",
  "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pyproj>=3.8.0",
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
tbgis = "tbgis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tbgis"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
